  const scenarios={
    'coffee:education':{intent:'Ajudar a escolher',label:'Educação',value:'Uma orientação útil antes da compra.',dirs:[['Qual filtro combina com o seu coador?','Um guia visual de compatibilidade, tamanho e rotina. Resolve uma dúvida concreta da primeira compra.','Carrossel','Parte de uma dúvida do público e organiza a escolha em três conferências.'],['Antes do café, vem a montagem.','Uma demonstração que acompanha a sequência de uso. Para quem entende melhor vendo o processo.','Vídeo demonstrativo','Troca a comparação por uma sequência prática, mantendo o mesmo objetivo.']],pages:[['O filtro acompanha o formato.','Confira o formato indicado para o seu modelo. Um encaixe parecido nem sempre é o encaixe certo.'],['O tamanho também conta.','Use a indicação do fabricante para conferir a medida antes da compra.'],['A sua rotina faz diferença.','Veja como montar, remover o filtro e limpar as peças depois do uso.'],['Escolha com três conferências.','Modelo. Medida. Manutenção. Salve este guia para consultar na próxima escolha.']]},
    'coffee:authority':{intent:'Mostrar como orientamos',label:'Autoridade',value:'Precisão na orientação, demonstrada no produto.',dirs:[['O que conferimos antes de indicar.','Mostra o cuidado da loja ao verificar montagem, compatibilidade e manutenção.','Demonstração','Torna visível um cuidado real, sem inventar avaliações ou testes.'],['Uma dúvida. Duas rotinas.','Compara usos diferentes e explica por que uma indicação muda conforme a pessoa.','Carrossel','Constrói confiança pelo raciocínio da recomendação, não por adjetivos.']],pages:[['A indicação começa pela rotina.','Antes de recomendar, entendemos como a pessoa prepara e limpa as peças.'],['Compatibilidade vem antes.','Modelo e filtro precisam corresponder às orientações de uso.'],['Mostre o que foi conferido.','Uma demonstração identificada explica a montagem, sem alegar um teste de sabor.'],['Uma boa orientação tem limites.','Grão, preparo e preferência também influenciam a experiência. Traga sua dúvida para a equipe.']]},
    'coffee:offer':{intent:'Apresentar uma solução',label:'Oferta',value:'Uma escolha clara, com condições confirmadas.',dirs:[['Um conjunto que já combina.','Apresenta o produto pela compatibilidade e pela rotina. Sem inventar desconto ou urgência.','Peça de oferta','A oferta resolve a mesma dúvida do público e mantém as condições comerciais transparentes.'],['Escolha pela sua rotina.','Ajuda a comparar as opções antes de avançar à página do produto.','Comparativo','Explica para quem cada opção serve antes de pedir a compra.']],pages:[['Seu conjunto começa por aqui.','Confira o modelo, o filtro indicado e os itens que acompanham o produto.'],['O que você recebe.','A embalagem e os itens devem corresponder à descrição aprovada da loja.'],['Uma escolha para a sua rotina.','Considere preparo, manutenção e espaço disponível.'],['Veja as opções da loja.','Preço, disponibilidade e condições serão confirmados antes de publicar. Nenhuma oferta real está ativa neste exemplo.']]},
    'warehouse:education':{intent:'Explicar uma investigação',label:'Educação',value:'Um diagnóstico que pode ser entendido e aplicado.',dirs:[['Antes de trocar o sistema, encontre a divergência.','Separa contagem, registro e conciliação para orientar a primeira investigação.','Carrossel','Parte da planilha e do processo atual, em vez de presumir que a solução é outro ERP.'],['O percurso de uma divergência.','Segue um exemplo fictício, do registro à conferência, mostrando o que observar.','Demonstração','Transforma uma questão abstrata em uma sequência de verificações.']],pages:[['Comece pela origem.','De onde veio a contagem? Confira período, local e responsável.'],['Depois, olhe o registro.','A entrada foi registrada no mesmo período e com a mesma unidade?'],['Concilie antes de concluir.','Compare o que foi contado com o que foi registrado e documente a diferença.'],['Três perguntas para começar.','Origem, registro e responsável. Use uma divergência para iniciar a conferência.']]},
    'warehouse:authority':{intent:'Demonstrar competência',label:'Autoridade',value:'O raciocínio por trás de uma investigação.',dirs:[['Como investigamos uma divergência.','Expõe hipótese, verificação e ajuste em um caso fictício identificado.','Caso comentado','A competência aparece nas ações e nos limites, não em uma promessa de perda zero.'],['O primeiro diagnóstico pode estar errado.','Mostra como uma verificação muda a interpretação inicial do problema.','Carrossel','Reconhecer e corrigir uma hipótese é parte da demonstração de competência.']],pages:[['A hipótese inicial.','Uma diferença não explica sozinha sua causa. Comece registrando o que precisa ser verificado.'],['O registro comparado.','Confronte períodos, unidades e origem dos dados no exemplo fictício.'],['A verificação muda a hipótese.','Mostre qual informação alterou a interpretação, sem ocultar o raciocínio.'],['Ação não é resultado garantido.','Documente o que foi corrigido e o que ainda precisa de acompanhamento.']]},
    'warehouse:offer':{intent:'Apresentar o serviço',label:'Oferta',value:'Escopo compreensível antes da contratação.',dirs:[['Um diagnóstico antes de outra ferramenta.','Explica o serviço de investigação sem substituir ou prometer trocar o ERP.','Peça de oferta','Conecta a oferta à alternativa real e à dificuldade do comprador.'],['O que precisamos para investigar.','Apresenta as informações necessárias e o próximo passo do diagnóstico.','Vídeo explicativo','Reduz a incerteza sobre como o serviço começa e o que está incluído.']],pages:[['Para quem precisa entender a diferença.','O diagnóstico examina o processo de inventário de pequenas distribuidoras.'],['O que vamos investigar.','Contagem, registro e conciliação, conforme o escopo confirmado.'],['Sem trocar o ERP por suposição.','A recomendação depende do que a investigação encontrar.'],['Vamos avaliar a adequação?','Consulte escopo e condições. Não envie informações confidenciais em comentários públicos.']]},
    'expert:education':{intent:'Ensinar uma estrutura',label:'Educação',value:'Uma decisão compreensível para quem recebe.',dirs:[['Comece pela decisão.','Reorganiza uma atualização técnica a partir do que a diretoria precisa decidir.','Carrossel','Resolve a tarefa de um líder técnico, sem prometer convencer qualquer pessoa.'],['O mesmo projeto, duas aberturas.','Compara duas estruturas com os mesmos fatos em um exemplo fictício.','Vídeo comparativo','Torna a diferença de roteiro visível sem inventar resultados de persuasão.']],pages:[['Qual decisão precisa acontecer?','Defina o que a reunião precisa esclarecer antes de organizar os detalhes.'],['Escolha o contexto necessário.','Explique o que o público precisa saber para avaliar a decisão.'],['Traga a evidência que sustenta.','Mantenha fatos e limites; não esconda informações relevantes para simplificar.'],['Reescreva a sua abertura.','Situação, decisão e evidência. Experimente essa ordem em um exemplo do seu trabalho.']]},
    'expert:authority':{intent:'Mostrar o método',label:'Autoridade',value:'Decisões de revisão explicadas com clareza.',dirs:[['Por que reorganizei este relatório.','Mostra três decisões de revisão em um material fictício identificado.','Demonstração','A autoridade nasce do raciocínio verificável, sem depoimentos inventados.'],['Quando a decisão não basta.','Apresenta um caso em que a diretoria precisa de mais contexto antes de decidir.','Carrossel','Um contraexemplo mostra onde a orientação precisa mudar.']],pages:[['O problema da primeira versão.','A sequência do relatório não deixa a decisão evidente neste exemplo fictício.'],['O que muda na abertura.','A decisão vem antes dos detalhes que a sustentam.'],['Por que os fatos continuam.','A revisão organiza a leitura sem alterar os dados do exemplo.'],['Nem toda reunião começa igual.','Se falta contexto, prepare o público. Uma estrutura é uma escolha, não uma regra universal.']]},
    'expert:offer':{intent:'Apresentar o treinamento',label:'Oferta',value:'O que a equipe pratica e recebe.',dirs:[['Reuniões que pedem decisão.','Explica o treinamento pela dificuldade de líderes técnicos, sem prometer promoção.','Peça de oferta','Nomeia público, tarefa e ajuda concreta antes do convite.'],['O que sua equipe vai praticar.','Mostra o exercício e como ele se relaciona a apresentações de projeto.','Vídeo explicativo','A demonstração ajuda a avaliar adequação antes de contratar.']],pages:[['Para líderes de equipes técnicas.','Um treinamento para organizar apresentações de projetos e decisões.'],['O que será praticado.','Reorganização de abertura, contexto e evidências com exemplos identificados.'],['O que precisa ser confirmado.','Formato, duração e condições comerciais são definidos no escopo aprovado.'],['Conheça o escopo para a equipe.','Solicite condições e adequação ao seu contexto, sem expor projetos sensíveis.']]}

  Object.entries(mounts).forEach(([k,el])=>{el.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(btn&&!btn.disabled)onAction(k,btn);});el.addEventListener('input',e=>{const key=e.target.dataset.input;if(key==='brief'||key==='comment')states[k][key]=e.target.value;});el.addEventListener('change',e=>{if(e.target.dataset.input==='brand'){states[k].brand=e.target.value;reset(states[k]);states[k].brief='';render(k);}persist();});el.addEventListener('keydown',e=>{if(e.key==='Escape'&&states[k].modal){states[k].modal=null;render(k);persist();}});el.addEventListener('keydown',e=>{if(e.key!=='Tab'||!states[k].modal)return;const items=[...el.querySelectorAll('.cd-dialog button,.cd-dialog select,.cd-dialog textarea')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});render(k);if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>{applyStyle(k);persist();}});tweak.addSelect(styles[k],'theme',{label:'Aparência',options:[{label:'Seguir aplicativo',value:'auto'},{label:'Escura',value:'dark'},{label:'Clara',value:'light'}]});tweak.addSelect(styles[k],'density',{label:'Espaçamento',options:[{label:'Confortável',value:'comfortable'},{label:'Compacto',value:'compact'}]});tweak.addSlider(styles[k],'radius',{label:'Cantos das peças',min:8,max:24,step:2,unit:'px'});}});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved&&restore(saved)){Object.keys(mounts).forEach(render);}});
})();
</script>
