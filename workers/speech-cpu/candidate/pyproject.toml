[project]
name = "clicko-kokoro-stock-runtime"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "espeakng-loader==0.2.4",
  "kokoro==0.9.4",
  "misaki[en]",
  "phonemizer-fork==3.3.2",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "torch",
]

[tool.uv]
package = false
exclude-newer = "2026-08-25T23:59:59Z"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
kokoro = { git = "https://github.com/hexgrad/kokoro.git", rev = "dfb907a02bba8152ca444717ca5d78747ccb4bec" }
misaki = { git = "https://github.com/hexgrad/misaki.git", rev = "fba1236595f2d2bf21d414ba6e57d25256afada3" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
