[project]
name = "clicko-qwen-appearance-image-candidate"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "accelerate==1.11.0",
  "diffusers==0.42.0",
  "pillow==12.0.0",
  "pydantic==2.12.5",
  "safetensors==0.8.0",
  "sentencepiece==0.2.1",
  "torch==2.6.0",
  "transformers==5.16.1",
]

[tool.uv]
package = false
exclude-newer = "2026-10-25T23:59:59Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
