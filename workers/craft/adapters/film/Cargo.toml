[package]
name = "clicko-filmcraft-adapter"
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "clicko-filmcraft-adapter"
path = "src/main.rs"

[dependencies]
clicko-craft-protocol = { path = "../common" }
filmcraft-engine = { path = "../../../../third_party/craft/filmcraft/crates/engine" }
filmcraft-format = { path = "../../../../third_party/craft/filmcraft/crates/format" }
filmcraft-media = { path = "../../../../third_party/craft/filmcraft/crates/media" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
