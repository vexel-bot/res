[project]
name = "clicko-kokoro-openvoice-clone-candidate"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "cn2an==0.5.22",
  "eng-to-ipa==0.0.2",
  "espeakng-loader==0.2.4",
  "inflect==7.0.0",
  "jieba==0.42.1",
  "kokoro==0.9.4",
  "librosa==0.11.0",
  "misaki[en]",
  "numpy==1.26.4",
  "phonemizer-fork==3.3.2",
  "pypinyin==0.50.0",
  "soundfile==0.13.1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "unidecode==1.3.7",
  "wavmark==0.0.3",
]

[tool.uv]
package = false
exclude-newer = "2026-08-26T23:59:59Z"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
kokoro = { git = "https://github.com/hexgrad/kokoro.git", rev = "dfb907a02bba8152ca444717ca5d78747ccb4bec" }
misaki = { git = "https://github.com/hexgrad/misaki.git", rev = "fba1236595f2d2bf21d414ba6e57d25256afada3" }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
